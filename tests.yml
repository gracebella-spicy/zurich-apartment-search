name: Scheduled Web Scraping

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zurich_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: zurich_apartments
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://zurich_user:${{ secrets.DB_PASSWORD }}@localhost:5432/zurich_apartments
          FLASK_ENV: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          flask db upgrade
      - name: Run scraping job
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://zurich_user:${{ secrets.DB_PASSWORD }}@localhost:5432/zurich_apartments
          FLASK_ENV: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SCRAPER_ENABLED: 'True'
        run: |
          python -c "
          from app import create_app
          from app.scheduler import scrape_properties_job
          import logging
          
          logging.basicConfig(level=logging.INFO)
          app = create_app()
          with app.app_context():
              scrape_properties_job()
          "
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Scraping job failed. Check logs for details.'
            })
